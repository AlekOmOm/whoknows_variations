global:
  scrape_interval:     2s # By default, scrape targets every 2 seconds.
  evaluation_interval: 2s # Evaluate rules every 2 seconds.

  # Attach these extra labels to all timeseries collected by this Prometheus instance.
  external_labels:
    monitor: 'whoknows-monitor'

rule_files:
  - 'prometheus.rules.yml'

alerting:
  alertmanagers:
  - static_configs:
    - targets: ['alertmanager-1:9093','alertmanager-2:9093']

scrape_configs:
  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 2 seconds.
    scrape_interval: 2s

    static_configs:
      - targets: ['prometheus:9090']

  - job_name:       'whoknows-app'

    # Override the global default and scrape targets from this job every 2 seconds.
    scrape_interval: 2s

    static_configs:
      - targets: ['whoknows_flask:8080']
        labels:
          group: 'production'
